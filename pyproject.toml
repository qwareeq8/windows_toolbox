[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "virelo"
dynamic = ["version"]
description = "Windows desktop utility for window snapping and Explorer column auto-sizing"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
authors = [{name = "Yusuf Qwareeq"}]
dependencies = [
    "PySide6>=6.6",
    "keyboard>=0.13.5",
    "pywin32>=306; sys_platform == 'win32'",
    "comtypes>=1.3.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.15.22",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "types-Pillow>=10.2.0.20240822",
]
build = [
    "pyinstaller>=6.21.0",
    "pyinstaller-hooks-contrib>=2026.6",
]

[tool.setuptools.packages.find]
include = ["virelo*"]

[tool.setuptools.dynamic]
# The package version derives from APP_VERSION in virelo/app/config.py, the single source of truth.
# That module is pure constants with no imports, so the attr lookup is safe at build time.
version = {attr = "virelo.app.config.APP_VERSION"}

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"virelo/*/__init__.py" = ["F401"]
"Virelo.spec" = ["F821", "UP009"]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = [
    "(^|/)[.]venv/",
    "(^|/)(build|dist)/",
    "^frontend/",
]

[[tool.mypy.overrides]]
module = [
    "comtypes",
    "comtypes.*",
    "keyboard",
    "pythoncom",
    "pywintypes",
    "win32api",
    "win32com",
    "win32com.*",
    "win32con",
    "win32event",
    "win32gui",
    "winerror",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
markers = [
    "requires_qt: marks tests that require an initialized PySide6/Qt runtime",
]
