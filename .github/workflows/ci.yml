name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/build-constraints.txt
      - name: Install the constrained test environment
        run: |
          python -m pip install --upgrade --constraint requirements/build-constraints.txt pip setuptools
          python -m pip install --constraint requirements/build-constraints.txt --editable ".[dev]"
          python -m pip check
      - name: Check Python formatting and lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy .
      - name: Run Python unit tests
        run: python -m pytest tests/unit/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        working-directory: frontend
      - name: Check frontend lint and formatting
        run: |
          npm run lint
          npm run format:check
        working-directory: frontend
      - name: Test and build the frontend
        run: |
          npm test
          npm run build
        working-directory: frontend

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Check version metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          config = Path("virelo/app/config.py").read_text(encoding="utf-8")
          match = re.search(r'^APP_VERSION\s*=\s*"(\d+\.\d+\.\d+)"\s*$', config, re.MULTILINE)
          if not match:
              raise SystemExit("APP_VERSION is missing or invalid.")
          expected = match.group(1)
          package = json.loads(Path("frontend/package.json").read_text(encoding="utf-8"))
          lock = json.loads(Path("frontend/package-lock.json").read_text(encoding="utf-8"))
          versions = {
              "package.json": package["version"],
              "package-lock.json": lock["version"],
              "package-lock.json root": lock["packages"][""]["version"],
          }
          mismatches = {name: version for name, version in versions.items() if version != expected}
          if mismatches:
              raise SystemExit(f"Version mismatch: expected {expected}, found {mismatches}.")
          print(f"All version records match {expected}.")
          PY
      - name: Check for stale legacy-name references
        shell: bash
        run: |
          if grep -rniw "toolbox" . \
            --include="*.py" --include="*.jsx" --include="*.js" \
            --include="*.json" --include="*.toml" --include="*.yml" \
            --include="*.iss" --include="*.spec" --include="*.md" \
            --include="*.ps1" --include="*.txt" \
            --exclude-dir=node_modules --exclude-dir=.git \
            --exclude-dir=dist --exclude-dir=build \
            --exclude-dir=.planning --exclude-dir=.venv \
            --exclude=ci.yml --exclude=verify-release.ps1 --exclude=CLAUDE.md; then
            echo "ERROR: Found stale legacy-name references."
            exit 1
          fi
          echo "OK: No stale references were found."

  windows-package-smoke:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/build-constraints.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create the constrained build environment
        shell: pwsh
        run: .\scripts\bootstrap.ps1 -Recreate
      - name: Test the PowerShell release helpers
        shell: pwsh
        run: .\scripts\test-release-tools.ps1
      - name: Build and smoke-test the Windows bundle
        shell: pwsh
        run: .\scripts\build-app.ps1
      - name: Build and verify the unsigned Windows installer
        shell: pwsh
        run: |
          .\scripts\build-installer.ps1 -SkipAppBuild
          .\scripts\verify-release.ps1
